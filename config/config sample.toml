# 超时设置
[timeout]
default = 30  # 默认超时时间（秒）
long_running = 300  # 长时间运行任务的超时时间

# Google搜索配置
[google]
api_key = ""  # 需要填入实际的Google API密钥
search_engine_id = ""  # 需要填入实际的搜索引擎ID

# 系统配置
[system]
debug = false
log_level = "INFO"

# API配置
[api]
url = "https://api.siliconflow.cn/v1/chat/completions"
model = "Qwen/Qwen2.5-14B-Instruct"
api_key = "sk-"
temperature = 0.7
max_tokens = 4096
stream = false

# Server配置
[server]
host = "127.0.0.1"
port = 3344
debug = true

# 浏览器配置
[browser]
headless = false  # 是否使用无头模式
max_content_length = 2000  # 最大内容长度
window_size = { width = 1920, height = 1080 }  # 浏览器窗口大小 